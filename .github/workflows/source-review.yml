name: Source review reminder

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  governed-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval

      # Runs before the assertions below so the report exists even when they
      # fail. The step is allowed to fail on its own; the job still fails at the
      # end, and the report is what makes the failure actionable.
      - name: Report governed inputs past re-review
        id: freshness
        continue-on-error: true
        run: node scripts/governance-freshness.mjs --report governance-freshness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the source review issue
        if: steps.freshness.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Governed source review overdue
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file governance-freshness.md
            gh issue comment "$number" --body "Still overdue on $(date -u +%Y-%m-%d). The list above has been refreshed from this run."
          else
            gh issue create --title "$TITLE" --body-file governance-freshness.md
          fi

      # Nothing else closes it. Without this the issue stays open forever with a
      # stale overdue report while the weekly check is green, which teaches the
      # reader to ignore the issue and then to ignore the next real one.
      - name: Close the source review issue once nothing is overdue
        if: steps.freshness.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Governed source review overdue
        run: |
          set -euo pipefail
          number="$(gh issue list --state open --search "$TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" \
              --body "Every governed input is back within its re-review window as of $(date -u +%Y-%m-%d). Closing; the weekly job will reopen this if anything expires again."
            gh issue close "$number" --reason completed
          fi

      - run: npm test -- tests/source-registry.test.ts tests/collector-reference.test.ts tests/source-freshness-current.test.ts tests/governance-freshness.test.ts
        env:
          CI_SOURCE_REVIEW: "true"

      - name: Fail when a governed input is past re-review
        if: steps.freshness.outcome == 'failure'
        run: |
          echo "Governed inputs are past their re-review date; see the job summary and the open issue." >&2
          exit 1
