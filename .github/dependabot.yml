version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    groups:
      # Vitest and its coverage provider must move together because their
      # versions are peer-coupled.
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - patch
          - minor
          - major
      routine-npm-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/node"
          - "@vitest/*"
          - "next"
          - "eslint-config-next"
          - "vitest"
        update-types:
          - minor
          - patch
      next-framework:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - minor
          - patch
      runtime-types:
        patterns:
          - "@types/node"
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions require a deliberate Node runtime upgrade.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # TypeScript majors require explicit support from the Next.js ESLint
      # toolchain; the current typescript-eslint release rejects TypeScript 7.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Detroit
    open-pull-requests-limit: 5
    groups:
      routine-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
